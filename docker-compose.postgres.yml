# 使用 Postgres 的完整配置示例
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}
      POSTGRES_DB: lab_booking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Only this service is published to the Internet.
  lab-booking-public:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PUBLIC_PORT:-8000}:8000"
    environment:
      - STORAGE_BACKEND=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=lab
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}
      - POSTGRES_DATABASE=lab_booking
      - JSON_DATA_DIR=/app/data
      - APP_ROLE=public
      - ADMIN_PASSWORD=disabled
      - CLASSROOMS=101实验室,102实验室,201机房,202机房,301多媒体教室,302多媒体教室,401研讨室,402研讨室
      - TIME_SLOTS=08:00-09:35,09:50-11:25,11:40-13:15,13:30-15:05,15:20-16:55,17:10-18:45
    volumes:
      - booking_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 默认仅 NAS 本机可访问；若要允许局域网管理，在 .env 设置 ADMIN_BIND_IP=0.0.0.0，
  # 并在 NAS 防火墙中仅允许局域网访问 8001。
  lab-booking-admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_PORT:-8001}:8000"
    environment:
      - APP_ROLE=admin
      - STORAGE_BACKEND=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=lab
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}
      - POSTGRES_DATABASE=lab_booking
      - JSON_DATA_DIR=/app/data
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before starting}
    volumes:
      - booking_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  booking_data:
