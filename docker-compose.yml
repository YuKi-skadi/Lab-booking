version: "3.8"

services:
  lab-booking:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - STORAGE_BACKEND=sqlite
      - JSON_DATA_DIR=/app/data
      - ADMIN_PASSWORD=admin123
      - CLASSROOMS=101实验室,102实验室,201机房,202机房,301多媒体教室,302多媒体教室,401研讨室,402研讨室
      - TIME_SLOTS=08:00-09:35,09:50-11:25,11:40-13:15,13:30-15:05,15:20-16:55,17:10-18:45
    volumes:
      - booking_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === 可选：使用 PostgreSQL 替代 SQLite ===
  # 取消下方注释，并将 lab-booking 的 STORAGE_BACKEND 改为 postgres
  #
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: lab
  #     POSTGRES_PASSWORD: lab123
  #     POSTGRES_DB: lab_booking
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #
  # lab-booking:
  #   ...
  #   environment:
  #     - STORAGE_BACKEND=postgres
  #     - POSTGRES_HOST=postgres
  #     - POSTGRES_PORT=5432
  #     - POSTGRES_USER=lab
  #     - POSTGRES_PASSWORD=lab123
  #     - POSTGRES_DATABASE=lab_booking
  #   depends_on:
  #     - postgres

volumes:
  booking_data:
  # postgres_data:
